<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hayri Efe Savran | Avukat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Montserrat:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background-color: #f2f2f2;
            color: #1a2a44;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        #root {
            display: block;
            width: 100%;
            min-height: 100vh;
        }

        .font-cinzel { font-family: 'Cinzel', serif; }
        .font-garamond { font-family: 'Cormorant Garamond', serif; }
        .font-montserrat { font-family: 'Montserrat', sans-serif; }
        
        .letterpress {
            color: #1a2a44; 
            text-shadow: 1px 1px 1px rgba(255, 255, 255, 0.7), -0.5px -0.5px 0.5px rgba(0, 0, 0, 0.1);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #1a2a44;
            border-radius: 10px;
        }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom": "https://esm.sh/react-dom@^19.2.4",
    "react-dom/client": "https://esm.sh/react-dom@^19.2.4/client",
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import React, { useEffect, useState } from 'react';
        import { createRoot } from 'react-dom/client';
        import { GoogleGenAI } from "@google/genai";

        // --- Data ---
        const PROJECTS = [
            { name: 'Özuğur & Savran Hukuk ve Danışmanlık', url: 'ozugursavran.com' },
            { name: 'Satır Arası', url: 'satirarasi.pro', subtitle: 'Sözleşme Analiz Uzmanı' },
            { name: 'Briefly AI', url: 'briefly.ai', subtitle: 'Less Explaining. More Lawyering.' },
            { name: 'Dava Pusulası', url: 'davapusulasi.com', subtitle: 'Yapay Zeka Hukuk Asistanı' }
        ];

        const INITIAL_BIO = "Hayri Efe Savran, geleneksel hukuk formasyonunu modern analitik disiplinlerle birleştiren, dijital dönüşüm ve LegalTech alanında yenilikçi projeler yürüten bir avukattır. Özuğur & Savran bünyesindeki pratiğini yapay zeka ve teknoloji odaklı girişimlerle harmanlayarak hukuk dünyasında sürdürülebilir çözümler inşa etmeyi amaçlar.";

        // --- Services ---
        const fetchEfeSavranInfo = async () => {
            const apiKey = typeof process !== 'undefined' ? process.env.API_KEY : '';
            if (!apiKey) return INITIAL_BIO;

            try {
                const ai = new GoogleGenAI({ apiKey });
                const response = await ai.models.generateContent({
                    model: 'gemini-3-flash-preview',
                    contents: "Hayri Efe Savran hakkında şık, tek paragraflık profesyonel bir biyografi özeti oluştur. Hukuk ve teknoloji vizyonuna değin. Dili Türkçe olsun. Çok zarif ve 'quiet luxury' bir üslup kullan.",
                    config: { tools: [{ googleSearch: {} }] }
                });
                return response.text?.trim() || INITIAL_BIO;
            } catch (error) {
                console.error("Gemini Error:", error);
                return INITIAL_BIO;
            }
        };

        // --- Components ---
        const TurkishMotif = ({ className }) => (
            <svg viewBox="0 0 100 100" className={className} fill="none" stroke="currentColor" strokeWidth="0.3">
                <path d="M50,10 C60,30 90,40 50,90 C10,40 40,30 50,10 Z" />
                <path d="M50,25 C55,35 70,40 50,65 C30,40 45,35 50,25 Z" opacity="0.5" />
                <circle cx="50" cy="50" r="2" fill="currentColor" opacity="0.3" />
            </svg>
        );

        const ProjectItem = ({ project }) => {
            const renderTitle = () => {
                if (project.name.includes('Hukuk ve Danışmanlık')) {
                    const parts = project.name.split('Hukuk ve Danışmanlık');
                    return (
                        <span className="font-garamond text-lg md:text-xl italic text-[#1a2a44]/80 group-hover:text-[#1a2a44] transition-all duration-500 block leading-tight">
                            {parts[0]} <span className="whitespace-nowrap">Hukuk ve Danışmanlık</span>
                        </span>
                    );
                }
                return (
                    <span className="font-garamond text-xl md:text-2xl italic text-[#1a2a44]/80 group-hover:text-[#1a2a44] transition-all duration-500 block leading-tight">
                        {project.name}
                    </span>
                );
            };

            return (
                <a 
                    href={project.url.startsWith('http') ? project.url : `https://${project.url}`}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="group relative block p-6 md:p-8 bg-[#fdfdfd] border border-[#1a2a44]/5 hover:border-[#1a2a44]/20 hover:-translate-y-1 transition-all duration-700 ease-[cubic-bezier(0.23,1,0.32,1)] overflow-hidden min-h-[140px] flex flex-col items-center justify-center"
                >
                    <div className="absolute inset-0 flex items-center justify-center opacity-[0.02] group-hover:opacity-[0.05] transition-opacity duration-700 pointer-events-none p-4">
                        <svg viewBox="0 0 100 100" className="w-full h-full text-[#1a2a44]" fill="none" stroke="currentColor" strokeWidth="0.5">
                            <path d="M50 0 L61 39 L100 50 L61 61 L50 100 L39 61 L0 50 L39 39 Z" />
                            <path d="M15 15 L85 85 M15 85 L85 15" strokeWidth="0.2" />
                            <circle cx="50" cy="50" r="10" strokeWidth="0.2" />
                            <path d="M50 20 L55 45 L80 50 L55 55 L50 80 L45 55 L20 50 L45 45 Z" strokeWidth="0.3" transform="rotate(45 50 50)"/>
                        </svg>
                    </div>
                    <div className="absolute inset-0 bg-gradient-to-br from-white/30 to-transparent pointer-events-none"></div>
                    <div className="relative z-10 flex flex-col items-center justify-center text-center">
                        {renderTitle()}
                        {project.subtitle && (
                            <span className="font-garamond text-[13px] md:text-sm italic text-[#1a2a44]/50 group-hover:text-[#1a2a44]/70 transition-all duration-500 mt-2 block tracking-wide leading-snug">
                                {project.subtitle}
                            </span>
                        )}
                        <div className="w-3 h-[0.5px] bg-[#1a2a44]/10 group-hover:bg-[#1a2a44]/30 group-hover:w-10 transition-all duration-700 mt-3"></div>
                    </div>
                    <div className="absolute bottom-0 left-0 w-full h-[1px] bg-[#1a2a44]/10 scale-x-0 group-hover:scale-x-100 transition-transform duration-1000 origin-center"></div>
                </a>
            );
        };

        const App = () => {
            const [bio, setBio] = useState(INITIAL_BIO);
            const [loading, setLoading] = useState(true);
            const mapsUrl = "https://www.google.com/maps/search/?api=1&query=Sancak,+549.+Sok.+32+Çankaya/ANKARA";

            useEffect(() => {
                const loadBio = async () => {
                    try {
                        const dynamicBio = await fetchEfeSavranInfo();
                        setBio(dynamicBio);
                    } catch (err) {
                        console.error(err);
                    } finally {
                        setLoading(false);
                    }
                };
                loadBio();
            }, []);

            return (
                <div className="relative min-h-screen w-full flex flex-col items-center justify-start md:justify-center bg-[#f2f2f2] p-4 sm:p-8 md:p-12 overflow-x-hidden selection:bg-[#1a2a44]/10">
                    <div className="fixed inset-0 pointer-events-none opacity-[0.03] z-0" style={{ backgroundImage: 'url("https://www.transparenttextures.com/patterns/stardust.png")' }}></div>
                    <div className="fixed inset-0 pointer-events-none opacity-[0.08] z-0" style={{ backgroundImage: 'url("https://www.transparenttextures.com/patterns/felt-paper.png")' }}></div>

                    <TurkishMotif className="absolute top-10 left-10 w-64 h-64 text-[#1a2a44] opacity-[0.02] -rotate-12 pointer-events-none z-0" />
                    <TurkishMotif className="absolute bottom-10 right-10 w-80 h-80 text-[#1a2a44] opacity-[0.015] rotate-12 pointer-events-none z-0" />
                    <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] border border-[#1a2a44]/[0.02] rounded-full pointer-events-none z-0"></div>

                    <main className="relative z-10 w-full max-w-[1400px] bg-[#fcfcfc] shadow-[0_30px_80px_rgba(0,0,0,0.02),inset_0_0_100px_rgba(255,255,255,0.5)] border border-white/80 p-8 sm:p-12 md:p-20 flex flex-col items-center text-center my-4 md:my-0">
                        <TurkishMotif className="w-12 h-12 text-[#1a2a44] opacity-[0.05] mb-8" />
                        
                        <div className="mb-10 md:mb-14">
                           <span className="font-montserrat text-[11px] md:text-[13px] tracking-[0.7em] uppercase text-[#1a2a44]/40 font-semibold">
                              İstanbul &mdash; Ankara &mdash; Antalya
                          </span>
                        </div>

                        <div className="w-20 h-[0.5px] bg-[#1a2a44]/10 mb-10 md:mb-14"></div>

                        <section className="mb-10 md:mb-14 relative">
                          <h1 className="font-cinzel text-3xl sm:text-4xl md:text-6xl letterpress tracking-[0.2em] mb-2 font-medium uppercase">
                            HAYRİ EFE SAVRAN
                          </h1>
                          <h2 className="font-garamond italic text-lg sm:text-xl md:text-3xl text-[#1a2a44] tracking-[0.35em] font-light">
                            Avukat
                          </h2>
                        </section>

                        <section className="w-full mb-16 md:mb-20 px-0 max-w-4xl min-h-[140px] flex items-center justify-center">
                          <p className={`font-garamond text-lg sm:text-xl md:text-2xl leading-relaxed text-[#1a2a44] italic text-justify md:text-center hyphens-auto w-full transition-opacity duration-1000 ${loading ? 'opacity-30' : 'opacity-90'}`}>
                            {bio}
                          </p>
                        </section>

                        <section className="w-full mb-16 md:mb-20 max-w-6xl">
                          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6">
                            {PROJECTS.map((project, idx) => (
                              <ProjectItem key={idx} project={project} />
                            ))}
                          </div>
                        </section>

                        <div className="flex flex-wrap justify-center items-center gap-8 sm:gap-16 md:gap-24 mb-12 md:mb-16">
                          <a href="https://www.linkedin.com/in/efesavran" target="_blank" rel="noopener noreferrer" className="font-garamond text-xl md:text-2xl italic text-[#1a2a44]/80 hover:text-[#1a2a44] transition-all border-b border-[#1a2a44]/10 pb-1">
                            LinkedIn
                          </a>
                          <a href="https://x.com/avefesavran" target="_blank" rel="noopener noreferrer" className="font-garamond text-xl md:text-2xl italic text-[#1a2a44]/80 hover:text-[#1a2a44] transition-all border-b border-[#1a2a44]/10 pb-1">
                            X Hesabı
                          </a>
                        </div>

                        <div className="flex items-center justify-center mb-8 md:mb-10">
                          <TurkishMotif className="w-6 h-6 text-[#1a2a44] opacity-[0.08]" />
                        </div>

                        <footer className="flex flex-col items-center">
                            <a href={mapsUrl} target="_blank" rel="noopener noreferrer" className="group flex flex-col items-center hover:opacity-100 transition-all duration-300">
                              <span className="font-garamond text-lg sm:text-xl md:text-2xl italic text-[#1a2a44]/80 text-center px-4">
                                  Sancak, 549. Sok. 32 Çankaya/ANKARA
                              </span>
                              <span className="font-montserrat text-[9px] tracking-[0.3em] uppercase text-[#1a2a44]/20 group-hover:text-[#1a2a44]/40 mt-2 transition-colors">
                                Haritada Görüntüle
                              </span>
                            </a>
                        </footer>
                    </main>

                    <div className="absolute top-0 right-0 w-[40rem] md:w-[60rem] h-[40rem] md:h-[60rem] bg-[#1a2a44]/[0.005] rounded-full blur-[120px] pointer-events-none z-0"></div>
                    <div className="absolute bottom-0 left-0 w-[50rem] md:w-[70rem] h-[50rem] md:h-[70rem] bg-[#1a2a44]/[0.005] rounded-full blur-[140px] pointer-events-none z-0"></div>
                </div>
            );
        };

        const rootElement = document.getElementById('root');
        if (rootElement) {
            const root = createRoot(rootElement);
            root.render(<App />);
        }
    </script>
</body>
</html>
